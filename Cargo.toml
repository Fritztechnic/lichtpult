[workspace]
members = [".", "src-tauri"]

[package]
name = "lichtpult"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "lichtpult-server"
path = "src/bin/server.rs"

[dependencies]
midir = "0.11.1"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
